name: 错误报告
description: 报告 GitHub-NetDisk 中的问题
title: "[Bug]: "
labels: ["Bug"]
type: "Bug"

body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 GitHub NetDisk！提交前请先确认问题在最新版本中仍然存在，搜索已有 Issue，并查阅官方文档。

        请勿在公开 Issue 中发布访问令牌、设备验证码、私有仓库链接或敏感文件信息。

        底层 Release 存储由 GitHub 提供。存储空间、流量、API 配额、账号权限与服务可用性均由 GitHub 管理，GitHub NetDisk 无法更改这些限制。
  - type: checkboxes
    id: before-reporting
    attributes:
      label: 反馈前
      options:
        - label: 我已确认此问题在最新版本中仍然存在。
          required: true
        - label: 我已搜索已有 Issue，并移除了 Token、私有链接和敏感文件信息。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请说明预期结果与实际结果。
      placeholder: 请清晰描述你看到的问题。
    validations:
      required: true
  - type: dropdown
    id: access-mode
    attributes:
      label: 访问方式
      description: 问题发生时你正在使用哪种访问方式？
      options:
        - GitHub App
        - Personal Access Token
        - 只读模式
        - 不确定
    validations:
      required: true
  - type: input
    id: OS
    attributes:
      label: 操作系统
      description: 你正在使用哪个操作系统及其版本？
      placeholder: 例如 Windows 11 24H2 26100
    validations:
      required: true
  - type: textarea
    id: logs-screenshots
    attributes:
      label: 日志或截图
      description: 请附上相关日志、截图、录屏或 GIF，并先移除 Token 与私人信息。
      placeholder: 可拖拽文件到这里，或粘贴已脱敏的日志。
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: GitHub NetDisk 版本
      description: 请确认已升级到最新版，并填写版本号。
      placeholder: 例如 v0.0.1
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现？
      description: 请列出可稳定复现问题的完整步骤。
      placeholder: 可附上截图、录屏或 GIF。
    validations:
      required: true
